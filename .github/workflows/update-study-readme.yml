name: Update study list

on:
  push:
    branches:
      - main
    paths:
      - '**/study.json'
      - 'scripts/generate-readme.py'
      - '.github/workflows/update-study-readme.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: study-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate study list
        run: python3 scripts/generate-readme.py

      - name: Commit README if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update study list [skip ci]"
            git push
          fi
